# DocuMind AI — Full-Stack Docker Compose Architecture (Checkpoint 11)
# Services:
#   1. db: PostgreSQL 18 + pgvector (for fresh/isolated deployments via profile 'with-db')
#   2. migration: One-shot Alembic migration runner ('alembic upgrade head')
#   3. backend: FastAPI REST & RAG service with non-root security
#   4. frontend: Multi-stage React + Vite application served via Nginx reverse proxy

services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: documind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_password}
      POSTGRES_DB: ${POSTGRES_DB:-documind_db}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - documind_pgdata:/var/lib/postgresql
    # Binds to 5433 by default to prevent conflict on machines with an active local PostgreSQL container
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind} -d ${POSTGRES_DB:-documind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - with-db

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: documind-migration
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind_password}@db:5432/${POSTGRES_DB:-documind_db}}
    # On standalone setups, migration connects directly to the 'db' service alias on documind-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: documind-backend
    restart: unless-stopped
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind_password}@db:5432/${POSTGRES_DB:-documind_db}}
      - JWT_SECRET=${JWT_SECRET:-documind_super_secret_jwt_key_for_development_change_in_production}
      - DOCUMIND_ENV=${DOCUMIND_ENV:-development}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - GENERATION_PROVIDER=${GENERATION_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - UPLOAD_DIR=/app/storage/documents
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_LOGIN_PER_MINUTE=${RATE_LIMIT_LOGIN_PER_MINUTE:-5}
      - RATE_LIMIT_RAG_PER_MINUTE=${RATE_LIMIT_RAG_PER_MINUTE:-20}
      - TRUSTED_PROXIES=127.0.0.1,::1,localhost,frontend
    volumes:
      # Persistent local storage for user PDF documents
      - ./storage/documents:/app/storage/documents
    depends_on:
      migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: documind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  documind_pgdata:
    external: true

networks:
  default:
    name: documind-network
    external: true
