# A generic, single database configuration for DocuMind AI Alembic migrations.

[alembic]
# Path to migration scripts
script_location = backend/alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with current directory
prepend_sys_path = .

# Version locations specification
version_locations = backend/alembic/versions

# Version path separator
path_separator = os

# Output encoding used when revisions are generated
output_encoding = utf-8

# sqlalchemy.url is dynamically loaded from DATABASE_URL in env.py to prevent exposing credentials
# sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
